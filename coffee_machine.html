<!DOCTYPE html>
<html>

<head>
  <title>Кофе машина</title>
  <link rel="stylesheet" href="coffee_style.css"> 
  <script type="text/javascript" src="coffee_script.js"></script> 
</head>

<body>
  <div> <!-- div - это базовый html-контейнер, который может содержать в себе другие html-элементы. -->
    
    <!-- блок с экраном калькулятора, где будет выводиться результат вычислений. -->
    <div id="coffee_window" class="coffee_window">
      0
    </div>

    <!-- блок с кнопками калькулятора. -->
    <div>
      <!--горизонтальный ряд из четырех кнопок-->
      <div>  
        <button id="coffee_op_clear" class="my-btn secondary">C</button>    <!-- про тэг кнопки: https://www.w3schools.com/tags/tag_button.asp   -->
        <button id="coffee_op_sign" class="my-btn secondary">+/-</button>
        <button id="coffee_op_percent" class="my-btn secondary">%</button>
        <button id="coffee_op_div" class="my-btn primary">/</button>
        <button id="coffee_op_backspace" class="my-btn primary">del</button>
      </div>

      <div>
        <button id="coffee_digit_7" class="my-btn">7</button>
        <button id="coffee_digit_8" class="my-btn">8</button>
        <button id="coffee_digit_9" class="my-btn">9</button>
        <button id="coffee_op_mult" class="my-btn primary">x</button>
        <button id="coffee_op_square" class="my-btn primary">x²</button>
      </div>

      <div>
        <button id="coffee_digit_4" class="my-btn">4</button>
        <button id="coffee_digit_5" class="my-btn">5</button>
        <button id="coffee_digit_6" class="my-btn">6</button>
        <button id="coffee_op_minus" class="my-btn primary">-</button>
        <button id="coffee_op_factorail" class="my-btn primary">x!</button>
      </div>

      <div>
        <button id="coffee_digit_1" class="my-btn">1</button>
        <button id="coffee_digit_2" class="my-btn">2</button>
        <button id="coffee_digit_3" class="my-btn">3</button>
        <button id="coffee_op_plus" class="my-btn primary">+</button>
        <button id="coffee_shot" class="my-btn primary">☕</button>
      </div>

      <div>
        <button id="coffee_digit_0" class="my-btn">0</button>
        <button id="coffee_digit_dot" class="my-btn">.</button>
        <button id="coffee_op_000" class="my-btn">000</button>
        <button id="coffee_op_equal" class="my-btn primary execute">=</button>
      </div>
      <!-- Кнопка "GitHub" -->
      <div>
        <button id="coffee_github" class="my-btn github">GitHub</button>
      </div>

      <details class="centered-details">
        <summary>Автор</summary>
        <p>ФИО: Аверьянов А.Д.</p>
        <p>Группа: РТ5-41Б</p>
      </details>

    </div>
  </div>
</body>
</html>
