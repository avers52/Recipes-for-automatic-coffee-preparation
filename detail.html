<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Модель - Кофейная галерея</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #2b1b0e;
            font-family: Arial, sans-serif;
        }
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: #d4a574;
            color: #2b1b0e;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
        .back-link:hover {
            background: #e5b88b;
        }
        h1 {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            color: #d4a574;
            font-size: 18px;
            margin: 0;
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 20px;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            z-index: 100;
            padding: 10px;
        }
        .control-btn {
            padding: 10px 20px;
            background: #d4a574;
            border: none;
            border-radius: 30px;
            color: #2b1b0e;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            min-width: 90px;
        }
        .control-btn:hover {
            background: #e5b88b;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d4a574;
            font-size: 20px;
            background: rgba(0,0,0,0.7);
            padding: 20px 40px;
            border-radius: 40px;
            z-index: 100;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <a href="index.html?view=gallery" class="back-link">← Назад в галерею</a>
    <h1 id="model-title">Загрузка...</h1>
    <div id="canvas-container"></div>
    <div id="loading">⏳ Загрузка 3D модели...</div>
    <div class="controls">
        <button class="control-btn" id="zoom-in">➕ Приблизить</button>
        <button class="control-btn" id="zoom-out">➖ Отдалить</button>
        <button class="control-btn" id="view-front">👁️ Спереди</button>
        <button class="control-btn" id="view-back">⬇️ Сзади</button>
        <button class="control-btn" id="view-left">⬅️ Слева</button>
        <button class="control-btn" id="view-right">➡️ Справа</button>
        <button class="control-btn" id="auto-rotate">🔄 Автовращение</button>
    </div>
    
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
        import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
        
        // Получаем параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        const modelPath = urlParams.get('model');
        const modelName = decodeURIComponent(urlParams.get('name') || 'Кофейная чашка');
        
        document.getElementById('model-title').textContent = modelName;
        
        // Настройка сцены
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2b1b0e);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 2, 4);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);
        
        // Управление
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.target.set(0, 0.8, 0);
        
        // Освещение
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(3, 5, 2);
        mainLight.castShadow = true;
        scene.add(mainLight);
        
        const fillLight = new THREE.PointLight(0xd4b48c, 0.5);
        fillLight.position.set(1, 2, 2);
        scene.add(fillLight);
        
        const backLight = new THREE.PointLight(0xffaa66, 0.3);
        backLight.position.set(-1, 1.5, -2);
        scene.add(backLight);
        
        // Пол для референса
        const gridHelper = new THREE.GridHelper(6, 20, 0xaa8866, 0x664422);
        gridHelper.position.y = -0.5;
        scene.add(gridHelper);
        
        // Вспомогательная плоскость (пол)
        const planeGeometry = new THREE.PlaneGeometry(5, 5);
        const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x443322, roughness: 0.6, metalness: 0.1, side: THREE.DoubleSide });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -0.5;
        plane.receiveShadow = true;
        scene.add(plane);
        
        // Загрузка модели
        const loader = new GLTFLoader();
        const loadingEl = document.getElementById('loading');
        
        if (modelPath) {
            console.log('Загрузка модели:', modelPath);
            
            loader.load(modelPath, (gltf) => {
                const model = gltf.scene;
                
                // Включаем тени
                model.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });
                
                // Вычисляем bounding box
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                
                // Масштабируем так, чтобы высота стала 1.5
                const targetHeight = 1.5;
                const scale = targetHeight / size.y;
                model.scale.set(scale, scale, scale);
                
                // Пересчитываем bounding box после масштабирования
                const newBox = new THREE.Box3().setFromObject(model);
                const newCenter = newBox.getCenter(new THREE.Vector3());
                const newSize = newBox.getSize(new THREE.Vector3());
                
                // Ставим модель на пол (основание на уровне y = -0.5)
                model.position.x = -newCenter.x;
                model.position.z = -newCenter.z;
                model.position.y = -newBox.min.y - 0.5;
                
                scene.add(model);
                loadingEl.style.display = 'none';
                
                // Обновляем цель камеры
                controls.target.set(0, newSize.y / 2 - 0.5, 0);
                controls.update();
                
                console.log('✅ Модель загружена, размер:', newSize);
            }, undefined, (error) => {
                console.error('Ошибка:', error);
                loadingEl.innerHTML = '❌ Ошибка загрузки модели';
            });
        } else {
            loadingEl.innerHTML = '❌ Модель не найдена';
        }
        
        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        // Обработка изменения размера окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Кнопки управления
        let currentFov = 45;
        document.getElementById('zoom-in').onclick = () => {
            currentFov = Math.max(20, currentFov - 5);
            camera.fov = currentFov;
            camera.updateProjectionMatrix();
        };
        document.getElementById('zoom-out').onclick = () => {
            currentFov = Math.min(100, currentFov + 5);
            camera.fov = currentFov;
            camera.updateProjectionMatrix();
        };
        
        const dist = 3.5;
        document.getElementById('view-front').onclick = () => {
            camera.position.set(0, 1.2, dist);
            controls.target.set(0, 0.8, 0);
            controls.update();
        };
        document.getElementById('view-back').onclick = () => {
            camera.position.set(0, 1.2, -dist);
            controls.target.set(0, 0.8, 0);
            controls.update();
        };
        document.getElementById('view-left').onclick = () => {
            camera.position.set(-dist, 1.2, 0);
            controls.target.set(0, 0.8, 0);
            controls.update();
        };
        document.getElementById('view-right').onclick = () => {
            camera.position.set(dist, 1.2, 0);
            controls.target.set(0, 0.8, 0);
            controls.update();
        };
        
        let autoRotate = false;
        const rotateBtn = document.getElementById('auto-rotate');
        rotateBtn.onclick = () => {
            autoRotate = !autoRotate;
            controls.autoRotate = autoRotate;
            rotateBtn.textContent = autoRotate ? '🔄 Автовращение (вкл)' : '🔄 Автовращение (выкл)';
        };
    </script>
</body>
</html>
